name: Build iOS

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Release IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.3

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Step 1 — Configure Flutter (--config-only, no xcodebuild)
        run: flutter build ios --release --no-codesign --config-only

      - name: Step 2 — Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Step 3 — Build Runner.app via xcodebuild (signing fully disabled)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios-xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Step 4 — Verify Runner.app structure
        run: |
          APP_DIR="build/ios-xcode/Build/Products/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "FATAL: Runner.app not found at $APP_DIR"
            echo "Searching for any .app:"
            find build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          echo "=== Runner.app contents ==="
          ls -la "$APP_DIR"
          echo ""
          echo "=== Frameworks ==="
          ls -la "$APP_DIR/Frameworks/" 2>/dev/null || echo "NO Frameworks directory!"
          echo ""
          echo "=== Flutter.framework ==="
          ls -la "$APP_DIR/Frameworks/Flutter.framework/" 2>/dev/null || echo "NO Flutter.framework!"
          echo ""
          echo "=== App.framework ==="
          ls -la "$APP_DIR/Frameworks/App.framework/" 2>/dev/null || echo "NO App.framework!"
          echo ""
          echo "=== Architectures in Runner binary ==="
          lipo -info "$APP_DIR/Runner" 2>/dev/null || echo "lipo failed"
          echo ""
          echo "=== Architectures in Flutter.framework ==="
          lipo -info "$APP_DIR/Frameworks/Flutter.framework/Flutter" 2>/dev/null || echo "lipo failed"
          echo ""
          echo "=== Architectures in App.framework ==="
          lipo -info "$APP_DIR/Frameworks/App.framework/App" 2>/dev/null || echo "lipo failed"

      - name: Step 5 — Package IPA
        run: |
          APP_DIR="build/ios-xcode/Build/Products/Release-iphoneos/Runner.app"
          mkdir -p output
          WORK="$(mktemp -d)"
          mkdir "$WORK/Payload"
          cp -R "$APP_DIR" "$WORK/Payload/"
          cd "$WORK"
          zip -r -q Runner.ipa Payload
          cd -
          mv "$WORK/Runner.ipa" output/Notes.ipa
          rm -rf "$WORK"
          echo "IPA size:"
          ls -lh output/Notes.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notes-IPA
          path: output/Notes.ipa
          compression-level: 0
